<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>摄像头配网</title><style>*{box-sizing:border-box}body{background:#0b1420;color:#ecf4fa;font:16px system-ui;margin:0;padding:32px 20px}main{max-width:460px;margin:5vh auto}h1{font-size:28px}p{line-height:1.7;color:#a9bece}label{display:block;margin:24px 0 8px}input,select,button{width:100%;font:inherit;padding:14px;border-radius:10px;border:1px solid #405367;background:#172838;color:inherit}button{background:#137c6d;border:0;margin-top:28px}button:disabled,select:disabled{opacity:.5}#result{white-space:pre-line;color:#8de2d0}a{color:#8de2d0}</style><main><h1>连接家里的 Wi-Fi</h1><p>选择附近的 2.4GHz Wi-Fi，再输入密码。连接成功后，让手机加入同一个 Wi-Fi，即可查看实时画面。</p><form id="form"><label for="ssid">选择 Wi-Fi</label><select id="ssid" required disabled><option value="">正在扫描附近的 Wi-Fi…</option></select><button id="refresh" type="button" style="margin-top:10px;background:#263d50">重新扫描</button><p id="scan-state" role="status"></p><label for="password">Wi-Fi 密码</label><input id="password" type="password" autocomplete="new-password" placeholder="无密码网络可留空"><button id="submit">连接 Wi-Fi</button></form><p id="result" role="status"></p><a id="link" hidden>打开监控画面</a><p>若热点没有自动弹出页面，请手动访问 192.168.4.1。配网期间请保留热点连接。</p></main><script>
const result=document.getElementById('result'),button=document.getElementById('submit'),ssidSelect=document.getElementById('ssid'),refresh=document.getElementById('refresh'),scanState=document.getElementById('scan-state'),passwordInput=document.getElementById('password');let submitted=0,scanning=false;
function updateSelection(){const open=ssidSelect.selectedOptions[0]?.dataset.open==='true';passwordInput.disabled=open;passwordInput.required=!!ssidSelect.value&&!open;if(open)passwordInput.value='';passwordInput.placeholder=open?'此网络无需密码':'请输入 Wi-Fi 密码';button.disabled=scanning||!ssidSelect.value||!!submitted;}
async function scan(){if(scanning||submitted)return;scanning=true;const previous=ssidSelect.value;refresh.disabled=true;ssidSelect.disabled=true;updateSelection();scanState.textContent='正在查找附近的 2.4GHz Wi-Fi…';try{const response=await fetch('/api/scan',{cache:'no-store'});if(!response.ok)throw Error();const networks=await response.json();ssidSelect.replaceChildren(new Option('请选择 Wi-Fi',''));for(const ap of networks){const signal=ap.rssi>=-60?'信号强':ap.rssi>=-75?'信号中':'信号弱';const option=new Option(`${ap.ssid} · ${signal}${ap.supported?(ap.open?' · 免密码':''):' · 暂不支持'}`,ap.ssid);option.dataset.open=String(ap.open);option.disabled=!ap.supported;ssidSelect.add(option)}if(networks.some(ap=>ap.ssid===previous&&ap.supported))ssidSelect.value=previous;scanState.textContent=networks.length?'点击上方选择网络。只显示设备能扫描到的 2.4GHz Wi-Fi。':'暂未发现 Wi-Fi，请靠近路由器后重新扫描。';}catch{scanState.textContent='扫描失败或设备正忙，请稍后点击“重新扫描”。'}finally{scanning=false;ssidSelect.disabled=false;refresh.disabled=false;updateSelection()}}
ssidSelect.onchange=()=>{passwordInput.value='';updateSelection()};refresh.onclick=scan;scan();
document.getElementById('form').onsubmit=async event=>{event.preventDefault();if(scanning||submitted)return;const ssid=document.getElementById('ssid').value,password=document.getElementById('password').value,enc=new TextEncoder();if(!ssid||enc.encode(ssid).length>32||(password&&(enc.encode(password).length<8||enc.encode(password).length>63))){result.textContent='名称最多 32 字节，密码需为 8–63 字节或留空。';return}button.disabled=true;refresh.disabled=true;ssidSelect.disabled=true;document.getElementById('link').hidden=true;try{const r=await fetch('/api/wifi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid,password})});if(!r.ok)throw Error(await r.text());submitted=Date.now();result.textContent='正在连接，请稍候…'}catch(e){result.textContent='提交失败：'+e.message;button.disabled=false;refresh.disabled=false;ssidSelect.disabled=false}};
setInterval(async()=>{try{const r=await fetch('/api/status',{cache:'no-store'}),s=await r.json();if(submitted&&s.provision_state===4){result.textContent="已连接，但网络信息保存失败，重启后可能需要重新配网。";button.disabled=false;refresh.disabled=false;ssidSelect.disabled=false;submitted=0}else if(submitted&&s.provision_state===3){result.textContent="新网络连接失败，请检查名称和密码后重试。";button.disabled=false;refresh.disabled=false;ssidSelect.disabled=false;submitted=0}else if(s.connected&&s.provision_state!==1&&(!submitted||s.provision_state===2)){result.textContent=`连接成功！地址：http://${s.ip}/\n请先让手机连接同一个 Wi-Fi，再打开此地址。配网热点将在连接成功约 60 秒后关闭。`;const link=document.getElementById('link');link.href=`http://${s.ip}/`;link.hidden=false;button.disabled=false;refresh.disabled=false;ssidSelect.disabled=false;submitted=0}else if(submitted&&Date.now()-submitted>35000){result.textContent=`连接失败或超时（原因码 ${s.reason}）。请检查名称、密码和 2.4GHz 信号后重试。`;button.disabled=false;refresh.disabled=false;ssidSelect.disabled=false;submitted=0}}catch{if(submitted&&Date.now()-submitted>35000){result.textContent='热点连接已断开，请检查 Wi-Fi 连接后重试。';button.disabled=false;refresh.disabled=false;ssidSelect.disabled=false;submitted=0}}},2000);
</script></html>
