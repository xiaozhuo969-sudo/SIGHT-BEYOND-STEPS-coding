<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>实时监控</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="相机监控">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box}
html{height:100%;background:#080d14}
body{
 margin:0;height:100vh;height:100dvh;min-width:0;
 padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
 display:grid;grid-template-rows:auto minmax(0,1fr) auto;
 background:#080d14;color:#e5edf5;font:16px system-ui;
}
header{min-width:0;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:18px;margin:0;margin-right:auto}
button,select{max-width:100%;min-height:40px;font:inherit;background:#1d2c3d;color:inherit;border:1px solid #39536b;border-radius:9px;padding:8px 10px;cursor:pointer}
button.active{background:#11675c}
/* The video gets the space left by the actual wrapped toolbar and footer. */
#stage{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);background:#000}
#view{min-width:0;min-height:0;width:100%;height:100%;background:#000;display:block}
#view-controls{display:none;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px;color:#9bb0c4;font-size:12px}
#exit-view{flex:none;min-height:40px;font-size:14px}
#stage.expanded{grid-template-rows:minmax(0,1fr) auto}
#stage.expanded #view-controls{display:flex}
body.immersive{grid-template-rows:minmax(0,1fr)}
body.immersive>header,body.immersive>footer{display:none}
footer{min-width:0;padding:8px 12px;color:#9bb0c4;font-size:12px;overflow-wrap:anywhere}
#state{color:#82dbc8}
#stage:fullscreen{width:100vw;height:100vh;height:100dvh;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage:-webkit-full-screen{width:100vw;height:100vh;height:100dvh;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media(max-width:600px){h1{width:100%}button,select{font-size:14px}}
@media(orientation:landscape) and (max-height:500px){
 header{padding:6px 8px;gap:6px}h1{font-size:16px;width:auto}
 button,select{font-size:14px;padding:6px 8px}
 footer{padding:4px 8px}
}
</style><header><h1>实时监控 <small id="state">未连接</small></h1><select id="size" aria-label="清晰度"><option value="qvga">流畅 · 320 × 240</option><option value="vga">清晰 · 640 × 480</option></select><select id="quality" aria-label="画质与帧率"><option value="fast">帧率优先 · 较强压缩</option><option value="fine">画质优先</option></select><button id="vr" class="active">双眼模式：开</button><button id="full" aria-controls="stage" aria-pressed="false">全屏</button><button id="play">开始观看</button></header><main id="stage"><canvas id="view" role="img" aria-label="监控视频与实时参数"></canvas><div id="view-controls"><span id="view-mode" role="status"></span><button id="exit-view">退出观看</button></div></main><footer><span id="stats">等待视频</span> · <span id="telemetry-status" role="status">等待手控制器</span><br>同一画面双眼显示，请横屏放入 VR 眼镜。单摄像头不产生立体景深。<span id="hint"></span></footer>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('view'),ctx=canvas.getContext('2d',{alpha:false}),stage=$('stage');
let stereo=true,controller=null,running=false,lastFrame=null,count=0,bytes=0,since=0,bitmapDecode=typeof window.createImageBitmap==='function';
// Receive display-only snapshots. No controls are sent through this connection.
const hud={packet:null,receivedAt:0,socket:null,retry:null,paused:false};
const nullableInteger=(v,min,max)=>v===null||(Number.isInteger(v)&&v>=min&&v<=max);
function validHud(p){const d=p?.data;return p&&typeof p.connected==='boolean'&&Number.isInteger(p.uplink_age_ms)&&p.uplink_age_ms>=-1&&p.uplink_age_ms<=120000&&d?.v===1&&Number.isInteger(d.session)&&d.session>0&&d.session<=4294967295&&Number.isInteger(d.seq)&&d.seq>=0&&d.seq<=4294967295&&nullableInteger(d.spo2_x10,0,1000)&&nullableInteger(d.voltage_mv,0,6000)&&nullableInteger(d.pitch_cdeg,-18000,18000)&&nullableInteger(d.roll_cdeg,-18000,18000)&&nullableInteger(d.distance_cm,0,65534)&&['spo2_age_ms','voltage_age_ms','air_age_ms'].every(k=>nullableInteger(d[k],0,120000))}
function hudReadings(now=performance.now()){
 const p=hud.packet,d=p?.data,elapsed=Math.max(0,now-hud.receivedAt);
 const link=hud.socket?.readyState===WebSocket.OPEN&&p?.connected&&p.uplink_age_ms>=0&&p.uplink_age_ms+elapsed<1200;
 const fresh=(key,limit)=>link&&d[key]!==null&&d[key]+elapsed<limit;
 const spo2=fresh('spo2_age_ms',10000)&&d.spo2_x10!==null?(d.spo2_x10/10).toFixed(1):'--';
 const voltage=fresh('voltage_age_ms',5000)&&d.voltage_mv!==null?(d.voltage_mv/1000).toFixed(2):'--';
 const air=fresh('air_age_ms',1200),angle=v=>v!==null?(v>=0?'+':'')+(v/100).toFixed(1):'--';
 const pitch=air?angle(d.pitch_cdeg):'--',roll=air?angle(d.roll_cdeg):'--';
 const distance=air&&d.distance_cm!==null?(d.distance_cm/100).toFixed(2):'--';
 let status=!link?(p?.uplink_age_ms>=0?'手控数据中断':'等待手控制器'):!air?'手控已连接 · 飞机未回传':spo2==='--'?'手控已连接 · 血氧未就绪':'手控已连接';
 if(hud.socket?.readyState!==WebSocket.OPEN)status='参数连接中断 / 重连中';
 return {link:!!link,spo2,voltage,pitch,roll,distance,status};
}
function connectHud(){
 if(hud.paused||document.hidden||hud.socket)return;
 clearTimeout(hud.retry);hud.retry=null;
 const url=new URL('/ws/view',location.href);url.protocol=location.protocol==='https:'?'wss:':'ws:';
 const socket=new WebSocket(url);hud.socket=socket;hud.packet=null;
 socket.onmessage=event=>{if(socket!==hud.socket)return;try{if(typeof event.data!=='string'||event.data.length>1200)throw Error();const packet=JSON.parse(event.data);if(!validHud(packet))throw Error();hud.packet=packet;hud.receivedAt=performance.now();render()}catch{hud.packet=null;socket.close()}};
 socket.onopen=()=>render();socket.onerror=()=>socket.close();
 socket.onclose=()=>{if(socket!==hud.socket)return;hud.socket=null;render();if(!hud.paused&&!document.hidden)hud.retry=setTimeout(connectHud,1000)};
}
function pauseHud(){hud.paused=true;clearTimeout(hud.retry);hud.retry=null;const socket=hud.socket;hud.socket=null;socket?.close();render()}
function drawHud(x,y,w,h,values){
 ctx.save();ctx.translate(x,y);ctx.scale(w/320,h/240);ctx.textBaseline='top';
 // Outline the glyphs for contrast without covering the scene with panels.
 const text=(content,bx,by)=>{ctx.strokeStyle='rgba(0,0,0,.9)';ctx.lineWidth=2;ctx.lineJoin='round';ctx.strokeText(content,bx,by);ctx.fillText(content,bx,by)};
 const value=(content,unit,bx,by,size=24,accent=false)=>{ctx.font=`500 ${size}px system-ui`;ctx.fillStyle=content==='--'?'#b1bcc5':accent?'#80f1d5':'#f3f8fb';text(content,bx,by);const width=ctx.measureText(content).width;ctx.font='11px system-ui';ctx.fillStyle='#b9cbd4';text(unit,bx+width+3,by+size-13)};
 value(values.spo2,'%',21,18,23,true);
 value(values.voltage,'V',221,18,23);
 value(values.distance,'m',21,193,23,true);
 value(values.pitch,'°',120,193,17);value(values.roll,'°',214,193,17);
 ctx.fillStyle=values.link?'#80f1d5':'#ffcd8a';ctx.beginPath();ctx.arc(16,229,2,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#dbe9ed';ctx.font='9px system-ui';text(values.status,23,223);ctx.textAlign='right';text('300 ms 更新',308,223);
 ctx.restore();
}
function render(){
 const w=canvas.width,h=canvas.height,values=hudReadings();ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
 const parts=stereo?2:1;
 for(let eye=0;eye<parts;eye++){
  const area=w/parts,fw=lastFrame?.width||320,fh=lastFrame?.height||240,scale=Math.min(area/fw,h/fh)*.94,dw=fw*scale,dh=fh*scale,x=eye*area+(area-dw)/2,y=(h-dh)/2;
  if(lastFrame)ctx.drawImage(lastFrame,x,y,dw,dh);drawHud(x,y,dw,dh,values);
 }
 if(stereo){ctx.fillStyle='#243446';ctx.fillRect(w/2-1,0,2,h)}
 if($('telemetry-status').textContent!==values.status)$('telemetry-status').textContent=values.status;
 canvas.setAttribute('aria-label',`监控视频；血氧 ${values.spo2} %；手控电压 ${values.voltage} V；飞机俯仰 ${values.pitch} 度；横滚 ${values.roll} 度；距离 ${values.distance} m；${values.status}`);
}
new ResizeObserver(()=>{canvas.width=Math.round(canvas.clientWidth*Math.min(devicePixelRatio,2));canvas.height=Math.round(canvas.clientHeight*Math.min(devicePixelRatio,2));render()}).observe(canvas);
$('vr').onclick=()=>{stereo=!stereo;$('vr').textContent='双眼模式：'+(stereo?'开':'关');$('vr').classList.toggle('active',stereo);render()};
// iPhone may expose only native VIDEO fullscreen. Keep the composited canvas
// and its HUD together; use page space when element fullscreen is unavailable.
let orientationLocked=false;
const fullscreenElement=()=>document.fullscreenElement||document.webkitFullscreenElement;
function fullscreenRequest(){
 if(typeof stage.requestFullscreen==='function'&&document.fullscreenEnabled!==false)return ()=>stage.requestFullscreen();
 if(typeof stage.webkitRequestFullscreen==='function'&&document.webkitFullscreenEnabled!==false)return ()=>stage.webkitRequestFullscreen();
 return null;
}
function syncViewMode(){
 const native=fullscreenElement()===stage,immersive=document.body.classList.contains('immersive'),expanded=native||immersive;
 stage.classList.toggle('expanded',expanded);$('full').setAttribute('aria-pressed',String(expanded));
 $('full').textContent=fullscreenRequest()?'全屏':'沉浸观看';
 const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
 $('view-mode').textContent=native?'全屏观看':standalone?'沉浸观看':'沉浸观看 · 地址栏仍由浏览器显示';
 if(!expanded&&orientationLocked){try{screen.orientation.unlock()}catch{}orientationLocked=false}
}
function immersiveView(){document.body.classList.add('immersive');syncViewMode();$('exit-view').focus({preventScroll:true})}
$('full').onclick=async()=>{
 const request=fullscreenRequest();
 if(request){try{await request();try{await screen.orientation.lock('landscape');orientationLocked=true}catch{}return}catch{}}
 immersiveView();
};
async function exitView(){
 if(fullscreenElement()===stage){
  try{const exit=document.exitFullscreen||document.webkitExitFullscreen;await exit.call(document)}
  catch{$('view-mode').textContent='请使用浏览器的退出全屏操作';return}
 }
 document.body.classList.remove('immersive');syncViewMode();$('full').focus({preventScroll:true});
}
$('exit-view').onclick=exitView;
for(const event of ['fullscreenchange','webkitfullscreenchange'])document.addEventListener(event,()=>{syncViewMode();if(fullscreenElement()===stage)$('exit-view').focus({preventScroll:true})});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.body.classList.contains('immersive'))exitView()});
syncViewMode();
function stop(){controller?.abort();controller=null;}
async function decode(jpeg){
 // Check segment lengths before handing camera data to the browser decoder.
 const invalid=()=>{throw Error('摄像头 JPEG 数据损坏，请断电重新插好摄像头排线。')};
 if(jpeg.length<4||jpeg[0]!==255||jpeg[1]!==216||jpeg[jpeg.length-2]!==255||jpeg[jpeg.length-1]!==217)invalid();
 let offset=2,scan=false;
 while(offset<jpeg.length-2){
  if(jpeg[offset++]!==255)invalid();
  while(jpeg[offset]===255)offset++;
  const marker=jpeg[offset++];if(!marker||marker===216||marker===217||offset+2>jpeg.length-2)invalid();
  const size=(jpeg[offset]<<8)|jpeg[offset+1];if(size<2||offset+size>jpeg.length-2)invalid();
  if(marker===218){scan=true;break}offset+=size;
 }
 if(!scan)invalid();
 const blob=new Blob([jpeg],{type:'image/jpeg'});let bitmapError;
 if(bitmapDecode){try{return await createImageBitmap(blob)}catch(error){bitmapError=error}}
 const image=new Image(),url=URL.createObjectURL(blob);image.decoding='async';
 try{
  await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('JPEG 图片加载失败'+(bitmapError?'；'+bitmapError.message:'')));image.src=url});
  if(!image.naturalWidth||!image.naturalHeight)throw Error('JPEG 图片尺寸无效');
  // Keep the Blob alive while this image is displayed; release with the frame.
  image.close=()=>{URL.revokeObjectURL(url);image.removeAttribute('src')};
  bitmapDecode=false;return image;
 }catch(error){URL.revokeObjectURL(url);image.removeAttribute('src');throw error}
}
async function start(){if(running)return;running=true;controller=new AbortController();const current=controller;$('play').textContent='停止';$('state').textContent='连接中';count=bytes=0;since=performance.now();let reader,stage='fetch';
try{const url=new URL('/stream',location.href);url.port='81';url.searchParams.set('size',$('size').value);url.searchParams.set('quality',$('quality').value);url.searchParams.set('format','bytes');const response=await fetch(url,{signal:current.signal,cache:'no-store'});if(!response.ok)throw Error(await response.text());reader=response.body.getReader();let buffer=new Uint8Array(0),length=null;
while(true){stage='read';const {value,done}=await reader.read();if(done)throw Error('视频连接已结束');stage='parse';bytes+=value.length;const merged=new Uint8Array(buffer.length+value.length);merged.set(buffer);merged.set(value,buffer.length);buffer=merged;let latest=null;
while(true){if(length===null){let end=-1;for(let i=0;i+3<buffer.length;i++){if(buffer[i]===13&&buffer[i+1]===10&&buffer[i+2]===13&&buffer[i+3]===10){end=i;break}}if(end<0){if(buffer.length>1024)throw Error('视频头部异常');break}const header=new TextDecoder().decode(buffer.subarray(0,end)),match=/Content-Length:\s*(\d+)/i.exec(header);if(!match)throw Error('缺少帧长度');length=Number(match[1]);if(length<=0||length>163840)throw Error('帧长度异常');buffer=buffer.slice(end+4)}if(buffer.length<length)break;latest=buffer.slice(0,length);buffer=buffer.slice(length);length=null;}
// Drop older complete frames in a burst; decode once and draw the same image twice.
if(latest){stage='decode';const frame=await decode(latest);if(current.signal.aborted){frame.close?.();break}lastFrame?.close?.();lastFrame=frame;stage='render';render();count++;$('state').textContent='实时';const elapsed=performance.now()-since;if(elapsed>=1000){$('stats').textContent=`显示 ${(count*1000/elapsed).toFixed(1)} fps · ${(bytes*8/elapsed/1000).toFixed(2)} Mbps · ${frame.width} × ${frame.height}`;since=performance.now();count=bytes=0;}}
}
}catch(error){$('state').textContent=current.signal.aborted?'已停止':'连接中断';if(!current.signal.aborted){const message=error.name+': '+error.message;$('stats').textContent=message+'（'+stage+'）';fetch('/api/client-error',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage,message:message.slice(0,200)}),keepalive:true}).catch(()=>{});}}finally{try{await reader?.cancel()}catch{}running=false;controller=null;$('play').textContent='开始观看';}}
$('play').onclick=()=>running?stop():start();$('quality').onchange=$('size').onchange=()=>{if(running){stop();$('hint').textContent=' 画面设置已切换，请重新开始观看。'}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseHud();else{hud.paused=false;connectHud()}});
window.addEventListener('pagehide',pauseHud);window.addEventListener('pageshow',()=>{hud.paused=false;connectHud()});
setInterval(()=>{if(!document.hidden)render()},200);connectHud();
fetch('/api/status').then(r=>r.json()).then(s=>{if(!s.camera){$('state').textContent='摄像头未就绪';$('stats').textContent=`${s.camera_error}；PSRAM ${(s.psram/1048576).toFixed(0)} MB。请检查摄像头排线、型号和 PSRAM 配置。`}else start()}).catch(()=>{$('state').textContent='设备未连接'});
</script></html>
